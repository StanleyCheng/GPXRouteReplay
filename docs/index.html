  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-title" content="GPX/FIT 路線回放">
  <meta property="og:title" content="GPX/FIT 路線回放">
  <meta property="og:description" content="Open a GPX or Garmin FIT activity file on your device and replay the filtered route on a 2D or 3D animated map.">
  <meta property="og:image" content="https://stanleycheng.github.io/GPXRouteReplay/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>GPX/FIT 路線回放</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-route-flow.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-route-flow.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="preconnect" href="https://api.maptiler.com">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7f5;
      --muted: #a7b0ab;
      --panel: rgba(15, 20, 18, .9);
      --line: rgba(255, 255, 255, .13);
      --accent: #c9ff45;
      --route: #e21d2f;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111815;
      color: var(--ink);
      font-family: Manrope, ui-sans-serif, sans-serif;
    }

    #map { position: fixed; inset: 0; background: #d9dedb; }
    .route-overlay { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; }
    .maplibregl-marker { z-index: 2; }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(7, 11, 9, .5), transparent 22%),
        linear-gradient(0deg, rgba(7, 11, 9, .7), transparent 34%);
    }

    .topbar {
      position: fixed;
      z-index: 3;
      top: max(22px, env(safe-area-inset-top));
      right: max(140px, calc(env(safe-area-inset-right) + 116px));
      left: max(24px, env(safe-area-inset-left));
      max-width: 920px;
      margin: auto;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      background: rgba(15, 20, 18, .3);
      backdrop-filter: blur(10px);
      transition: width .2s, padding .2s;
    }

    .topbar-details { min-width: 0; overflow: hidden; }
    .topbar-toggle {
      position: absolute;
      top: 4px;
      right: 4px;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 20, 18, .28);
      color: var(--muted);
      cursor: pointer;
      list-style: none;
    }
    .topbar-toggle::-webkit-details-marker { display: none; }
    .topbar-toggle::before { content: '−'; }
    .topbar:not([open]) { right: auto; width: 44px; height: 44px; margin: 0; padding: 0; border-radius: 13px; }
    .topbar:not([open]) .topbar-toggle { inset: 0; width: 44px; height: 44px; border: 0; background: transparent; }
    .topbar:not([open]) .topbar-toggle::before { content: '+'; }

    .lang-toggle {
      position: fixed;
      z-index: 5;
      top: max(22px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      display: flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .24);
      backdrop-filter: blur(10px);
    }

    .lang-toggle button {
      height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .lang-toggle button:hover { background: rgba(255, 255, 255, .1); color: var(--ink); }
    .lang-toggle button.active { background: var(--accent); color: #10150f; }

    .eyebrow {
      margin: 1px 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      padding-right: 48px;
      overflow: hidden;
      font-size: clamp(24px, 4vw, 42px);
      line-height: .95;
      letter-spacing: -.055em;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "Barlow Condensed", sans-serif;
    }

    .summary {
      display: flex;
      gap: 12px;
      margin: 7px 0 0;
      overflow: hidden;
      color: rgba(244, 247, 245, .72);
      font-size: 11px;
      white-space: nowrap;
    }

    .summary strong { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 750; }

    .control-panel {
      position: fixed;
      z-index: 3;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      left: max(24px, env(safe-area-inset-left));
      max-width: 920px;
      margin: auto;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px);
      transition: max-width .2s, padding .2s;
    }

    .dashboard-collapse {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 44px;
      height: 44px;
      border-radius: 9px;
      color: var(--muted);
      line-height: 1;
    }

    .panel-details { transition: opacity .15s; }
    .compact-bar { display: none; align-items: center; gap: 10px; }
    .compact-distance { min-width: 0; margin-right: auto; }
    .compact-distance .label { margin-bottom: 1px; }
    .compact-distance .value { font-size: 16px; }

    .control-panel.collapsed { max-width: 360px; padding: 8px; }
    .control-panel.collapsed .panel-details,
    .control-panel.collapsed .dashboard-collapse { display: none; }
    .control-panel.collapsed .compact-bar { display: flex; }

    .compact-play {
      width: 44px;
      flex: 0 0 44px;
      border-color: transparent;
      background: var(--accent);
      color: #10150f;
      font-size: 17px;
    }

    .dashboard-expand { width: 44px; flex: 0 0 44px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
      padding-right: 40px;
    }

    .stat { min-width: 0; padding: 0 8px; border-left: 1px solid var(--line); }
    .stat:first-child { border-left: 0; }

    .label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .value {
      display: block;
      overflow: hidden;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "Barlow Condensed", sans-serif;
    }

    .transport {
      display: grid;
      grid-template-columns: 44px 44px minmax(120px, 1fr) 72px 44px;
      gap: 10px;
      align-items: center;
    }

    .settings-toggle {
      position: relative;
      display: grid;
      width: 44px;
      padding: 0;
      place-items: center;
      color: var(--muted);
    }

    .settings-toggle:hover { color: var(--ink); }
    .settings-toggle[aria-expanded="true"] { border-color: transparent; background: var(--accent); color: #10150f; }

    .settings-popover {
      position: absolute;
      right: 12px;
      bottom: calc(100% + 10px);
      display: grid;
      grid-template-columns: repeat(3, 48px);
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .35);
      backdrop-filter: blur(18px);
    }

    .settings-popover[hidden] { display: none; }

    .icon-toggle { position: relative; display: block; width: 48px; height: 48px; cursor: pointer; }
    .icon-toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, .07);
      color: var(--muted);
      transition: background .15s, color .15s;
    }

    .icon-toggle:hover .icon-btn { background: rgba(255, 255, 255, .13); color: var(--ink); }
    .icon-toggle input:checked + .icon-btn { border-color: transparent; background: var(--accent); color: #10150f; }
    .record-toggle input:checked + .icon-btn { background: var(--route); color: #fff; }
    .icon-toggle input:focus-visible + .icon-btn { outline: 2px solid var(--accent); outline-offset: 2px; }

    .record-toggle-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 80, 80, .45);
      box-shadow: 0 0 0 1px rgba(255, 80, 80, .25);
      transition: background .2s, box-shadow .2s;
      pointer-events: none;
    }

    .record-toggle input:checked ~ .record-toggle-dot { background: #ffe1e1; box-shadow: 0 0 8px rgba(255, 225, 225, .8); }

    .settings-toggle::after,
    .icon-toggle::after {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      z-index: 7;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(15, 20, 18, .95);
      color: var(--ink);
      content: attr(data-tooltip);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 3px);
      transition: opacity .15s, transform .15s;
    }

    .settings-toggle:hover::after,
    .icon-toggle:hover::after,
    .settings-toggle:focus-visible::after,
    .icon-toggle:focus-within::after { opacity: 1; transform: translate(-50%, 0); }

    [lang="zh-Hant"] .eyebrow,
    [lang="zh-Hant"] .label { letter-spacing: .12em; text-transform: none; }

    [lang="zh-Hant"] .record-dialog .meta,
    [lang="zh-Hant"] .record-dialog button { letter-spacing: .08em; text-transform: none; }

    button, select {
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .07);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
    }

    button:hover, select:hover { background: rgba(255, 255, 255, .13); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [data-play] { border-color: transparent; background: var(--accent); color: #10150f; font-size: 17px; }
    [data-play]:hover { background: #dbff84; }
    #speed { width: 72px; padding: 0 4px 0 8px; }

    input[type="range"] { width: 100%; height: 44px; accent-color: var(--accent); cursor: pointer; }

    .import-button {
      display: inline-grid;
      height: 44px;
      padding: 0 12px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .07);
      color: var(--ink);
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .import-button:hover { background: rgba(255, 255, 255, .13); }
    .import-button:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .gpx-input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .marker-label {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      background: #121814;
      color: #fff;
      box-shadow: 0 5px 16px rgba(0, 0, 0, .36);
      font-size: 9px;
      font-weight: 900;
    }

    .marker-label.end { background: #f2f4ef; color: #10150f; }
    .km-marker { transition: opacity .25s; }

    .km-marker span {
      position: relative;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--route);
      border-radius: 50% 50% 50% 4px;
      background: #fff;
      color: #b20f1e;
      box-shadow: 0 5px 15px rgba(0, 0, 0, .28);
      font-size: 12px;
      font-weight: 900;
      transform: rotate(-45deg);
      animation: marker-pop .25s ease-out;
    }

    .km-marker span b { transform: rotate(45deg); }

    @keyframes marker-pop {
      from { opacity: 0; transform: rotate(-45deg) scale(.5) translateY(8px); }
      to { opacity: 1; transform: rotate(-45deg) scale(1) translateY(0); }
    }

    .maplibregl-ctrl-top-right { top: max(12px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
    .maplibregl-ctrl-group { overflow: hidden; border-radius: 12px; }
    .maplibregl-ctrl-attrib { border-radius: 8px 0 0; font-size: 10px; }

    .empty-state {
      position: fixed;
      z-index: 3;
      inset: 50% auto auto 50%;
      width: min(420px, calc(100% - 40px));
      padding: 24px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(15, 20, 18, .92);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .4);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .empty-state[hidden] { display: none; }
    .empty-state h2 { margin: 0 0 8px; font-family: "Barlow Condensed", sans-serif; font-size: 28px; letter-spacing: -.025em; }
    .empty-state p { margin: 0 auto 18px; max-width: 32ch; color: var(--muted); line-height: 1.5; }
    .empty-state .import-button { display: inline-grid; background: var(--accent); color: #10150f; }
    .empty-note { display: block; margin-top: 12px; color: #89928d; font-size: 11px; }
    .status {
      position: fixed;
      z-index: 5;
      top: max(118px, calc(env(safe-area-inset-top) + 96px));
      left: 50%;
      width: max-content;
      max-width: min(560px, calc(100% - 32px));
      margin: 0;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(15, 20, 18, .94);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -6px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .status.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 580px) {
      .topbar {
        top: max(12px, env(safe-area-inset-top));
        right: max(106px, calc(env(safe-area-inset-right) + 96px));
        left: max(10px, env(safe-area-inset-left));
        max-width: none;
        padding: 11px 12px;
      }

      .lang-toggle { top: max(12px, env(safe-area-inset-top)); }
      .lang-toggle button { height: 28px; padding: 0 9px; font-size: 11px; }
      h1 { font-size: 24px; }
      .summary { gap: 8px; margin-top: 6px; }
      .control-panel {
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        left: max(10px, env(safe-area-inset-left));
        padding: 10px;
        border-radius: 17px;
      }

      .control-panel.collapsed { max-width: none; }
      .stats { gap: 4px; margin-bottom: 8px; padding-right: 34px; }
      .stat { padding: 0 6px; }
      .label { font-size: 8px; }
      .value { font-size: 13px; }
      .transport { grid-template-columns: 44px 44px minmax(60px, 1fr) 64px 44px; gap: 6px; }
      #speed { width: 64px; padding-left: 5px; font-size: 12px; }
      .settings-popover { right: 8px; }
      .rec-indicator { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 130px); }
      .empty-state { top: 46%; width: calc(100% - 32px); }
      .status { top: max(106px, calc(env(safe-area-inset-top) + 88px)); }
    }

    @media (max-width: 390px) {
      .summary { gap: 3px; font-size: 10px; }
    }

    @media (max-height: 700px) and (max-width: 580px) {
      .empty-state { top: 42%; }
      .control-panel:not(.collapsed) .stats { display: none; }
      .dashboard-collapse {
        top: -50px;
        right: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 8px 22px rgba(0, 0, 0, .24);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  
    .rec-indicator {
      position: fixed;
      left: 50%;
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 150px);
      z-index: 4;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 9px 16px 9px 13px;
      border: 1px solid rgba(255, 95, 95, .55);
      border-radius: 999px;
      background: rgba(20, 8, 8, .88);
      color: #ffbcbc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      transform: translate(-50%, 6px);
      opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
      pointer-events: none;
    }
    .rec-indicator.active {
      display: inline-flex;
      transform: translate(-50%, 0);
      opacity: 1;
    }
    .rec-indicator .dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: #ff5757;
      box-shadow: 0 0 12px rgba(255, 87, 87, .85);
      animation: rec-pulse 1.1s ease-in-out infinite;
    }
    .rec-indicator .rec-elapsed {
      color: rgba(255, 188, 188, .55);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: .12em;
    }
    .rec-error {
      position: fixed;
      left: 50%;
      top: calc(max(22px, env(safe-area-inset-top)) + 12px);
      z-index: 5;
      max-width: min(560px, calc(100% - 32px));
      padding: 11px 16px;
      border: 1px solid rgba(255, 100, 100, .6);
      border-radius: 12px;
      background: rgba(48, 12, 12, .92);
      color: #ffd0d0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .01em;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
      transform: translate(-50%, -8px);
      opacity: 0;
      pointer-events: none;
      transition: transform .25s ease, opacity .25s ease;
    }
    .rec-error.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }
    @keyframes rec-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.72); }
    }
    @media (max-height: 640px) {
      .rec-indicator { bottom: calc(max(24px, env(safe-area-inset-bottom)) + 120px); }
    }

    .record-dialog {
      position: fixed;
      z-index: 6;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: rgba(7, 11, 9, .62);
      backdrop-filter: blur(8px);
    }
    .record-dialog.open {
      display: flex;
      animation: rec-dialog-in .2s ease-out;
    }
    @keyframes rec-dialog-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .record-dialog .card {
      position: relative;
      width: min(440px, 100%);
      padding: 26px 22px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(22, 28, 24, .98), rgba(15, 20, 18, .98));
      box-shadow: 0 24px 56px rgba(0, 0, 0, .55);
      color: var(--ink);
    }
    .record-dialog .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      border-radius: 20px 20px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--route));
    }
    .record-dialog .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .record-dialog .header .badge {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(255, 87, 87, .15);
      color: #ff8585;
    }
    .record-dialog h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.01em;
    }
    .record-dialog .close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }
    .record-dialog .close:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
    .record-dialog .meta {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .record-dialog .meta > span {
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .record-dialog .preview,
    .record-dialog video {
      width: 100%;
      max-height: 44vh;
      border-radius: 12px;
      background: #000;
      display: block;
      object-fit: contain;
    }
    .record-dialog .preview-fallback {
      display: none;
      margin: 16px 0 0;
      padding: 18px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
    .record-dialog .preview-fallback.show { display: block; }
    .record-dialog .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .record-dialog button {
      flex: 1;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, .06);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: background .15s, transform .05s;
    }
    .record-dialog button:active { transform: scale(.98); }
    .record-dialog button.save {
      background: var(--accent);
      border-color: transparent;
      color: #111815;
      box-shadow: 0 6px 20px rgba(201, 255, 69, .25);
    }
    .record-dialog button.save:hover { background: #d6ff5d; }
    .record-dialog button.discard:hover { background: rgba(255, 255, 255, .12); }
    .record-dialog button:disabled { opacity: .55; cursor: progress; }
    .record-dialog .fallback-note {
      display: none;
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .05);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .record-dialog .fallback-note.show { display: block; }
</style>
</head>
<body>
  <div id="map" aria-label="GPX 或 FIT 路線動畫地圖" data-i18n-aria="mapAria"></div>
  <div class="shade"></div>

  <div class="lang-toggle" role="group" aria-label="Language / 語言">
    <button type="button" data-lang="en">ENG</button>
    <button type="button" data-lang="zh-Hant" class="active">中文</button>
  </div>

  <details class="topbar" open>
    <summary class="topbar-toggle" aria-label="顯示或隱藏路線標題" data-i18n-aria="topbarToggle"></summary>
    <div class="topbar-details" id="topbar-details">
      <p class="eyebrow" data-i18n="eyebrow">路線回放</p>
      <h1 id="title">GPX/FIT 路線回放</h1>
      <p class="summary"><span><span data-i18n="summaryDistance">距離</span> <strong id="total-distance">—</strong></span><span><span data-i18n="summaryStart">開始</span> <strong id="start-time">—</strong></span><span><span data-i18n="summaryPace">平均配速</span> <strong id="average-pace">—</strong></span></p>
    </div>
  </details>

  <section class="empty-state" id="empty-state">
    <h2 data-i18n="emptyTitle">從你的裝置開啟路線</h2>
    <p>從「檔案」或 iCloud Drive 選擇 GPX 或 Garmin 活動 FIT 檔案。你的路線只會保留在此瀏覽器中，絕不會上傳。</p>
    <label class="import-button">
      <span data-i18n="chooseFile">選擇 GPX/FIT</span>
      <input class="gpx-input" type="file" accept=".gpx,.fit,application/gpx+xml,application/xml,text/xml,application/octet-stream">
    </label>
    <small class="empty-note" data-i18n="emptyNote">上次選擇的路線會在此裝置重新開啟。</small>
  </section>

  <main class="control-panel" id="dashboard" aria-label="路線回放控制" data-i18n-aria="dashboardAria">
    <button class="dashboard-collapse" id="dashboard-collapse" type="button" aria-label="隱藏面板" data-i18n-aria="hideDashboard" aria-controls="dashboard-details" aria-expanded="true">⌄</button>
    <div class="panel-details" id="dashboard-details">
      <section class="stats" aria-live="polite">
        <div class="stat"><span class="label" data-i18n="statDistance">距離</span><span class="value" id="distance">0.00 km</span></div>
        <div class="stat"><span class="label" data-i18n="statElapsed">時間</span><span class="value" id="elapsed">0:00</span></div>
        <div class="stat"><span class="label" data-i18n="statElevation">海拔</span><span class="value" id="elevation">—</span></div>
        <div class="stat"><span class="label" data-i18n="statHeartRate">心率</span><span class="value" id="heart-rate">—</span></div>
      </section>
      <section class="transport">
        <button type="button" data-play aria-label="播放路線">▶</button>
        <button id="restart" type="button" aria-label="重新開始" data-i18n-aria="restartRoute">↺</button>
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="路線進度" data-i18n-aria="progressAria" aria-valuetext="尚未載入路線">
        <select id="speed" aria-label="回放速度" data-i18n-aria="speedAria">
          <option value="0.05">0.05×</option>
          <option value="0.1">0.1×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <button class="settings-toggle" id="settings-toggle" type="button" aria-label="設定" data-i18n-aria="settings" aria-expanded="false" aria-controls="settings-popover" data-i18n-tip="settings" data-tooltip="設定">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div class="settings-popover" id="settings-popover" hidden>
          <label class="icon-toggle" data-i18n-tip="kmMarkers" data-tooltip="公里標記">
            <input id="marker-toggle" type="checkbox" aria-label="公里標記" data-i18n-aria="kmMarkers">
            <span class="icon-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
          </label>
          <label class="icon-toggle" data-i18n-tip="startFinish" data-tooltip="起點／終點">
            <input id="endpoint-toggle" type="checkbox" checked aria-label="起點／終點" data-i18n-aria="startFinish">
            <span class="icon-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                <line x1="4" y1="22" x2="4" y2="15"></line>
              </svg>
            </span>
          </label>
          <label class="icon-toggle" data-i18n-tip="terrain3d" data-tooltip="3D 地形">
            <input id="view-3d-toggle" type="checkbox" checked aria-label="3D 地形" data-i18n-aria="terrain3d">
            <span class="icon-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2z"></path>
              </svg>
            </span>
          </label>
          <label class="icon-toggle" data-i18n-tip="follow" data-tooltip="跟隨鏡頭">
            <input id="follow-toggle" type="checkbox" checked aria-label="跟隨鏡頭" data-i18n-aria="follow">
            <span class="icon-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="7"></circle>
                <line x1="12" y1="1" x2="12" y2="5"></line>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="1" y1="12" x2="5" y2="12"></line>
                <line x1="19" y1="12" x2="23" y2="12"></line>
              </svg>
            </span>
          </label>
          <label class="icon-toggle record-toggle" data-i18n-tip="recordVideo" data-tooltip="錄製影片">
            <input id="record-toggle" type="checkbox" aria-label="錄製影片" data-i18n-aria="recordVideo">
            <span class="icon-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="6" width="13" height="12" rx="2"></rect>
                <path d="m22 8-7 4 7 4z"></path>
              </svg>
            </span>
            <span class="record-toggle-dot" aria-hidden="true"></span>
          </label>
          <label class="icon-toggle" data-i18n-tip="importFile" data-tooltip="匯入檔案">
            <input class="gpx-input" type="file" accept=".gpx,.fit,application/gpx+xml,application/xml,text/xml,application/octet-stream" aria-label="匯入檔案" data-i18n-aria="importFile">
            <span class="icon-btn" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </span>
          </label>
        </div>
      </section>
    </div>
    <div class="compact-bar">
      <button class="compact-play" type="button" data-play aria-label="播放路線">▶</button>
      <div class="compact-distance">
        <span class="label" data-i18n="statDistance">距離</span>
        <span class="value" id="compact-distance">0.00 km</span>
      </div>
      <button class="dashboard-expand" id="dashboard-expand" type="button" aria-label="顯示面板" data-i18n-aria="showDashboard" aria-controls="dashboard-details" aria-expanded="false">⌃</button>
    </div>
  </main>
  <p class="status" id="status" aria-live="polite"></p>

      let active = false;
      let raf = 0;
      const step = () => {
        if (!active) return;
        const mapCanvas = map.getCanvas();
        const mapW = mapCanvas.width;
        const mapH = mapCanvas.height;
        if (mapW > 0 && mapH > 0) {
          if (canvas.width !== mapW || canvas.height !== mapH) {
            canvas.width = mapW;
            canvas.height = mapH;
          }
          context.clearRect(0, 0, canvas.width, canvas.height);
          context.drawImage(mapCanvas, 0, 0);
          if (routeOverlay && routeOverlay.width > 0 && routeOverlay.height > 0) {
            context.drawImage(routeOverlay, 0, 0);
          }

        raf = requestAnimationFrame(step);
      };
      return {
        start() { if (active) return; active = true; step(); },
        stop() { active = false; if (raf) cancelAnimationFrame(raf); raf = 0; },
        reset() {
          active = false;
          if (raf) cancelAnimationFrame(raf);

    let mapReady = false;
    let points = [];
    let displayPoints = [];
    let cumulativeDistance = [];
    let totalDistance = 0;
    let totalDuration = 0;
    let mileageMarkers = [];
    let endpointMarkers = [];

    let progress = 0;
    let lastFrame = 0;
    let followBearing = 0;

    let overlayVisible = false;
    let view3dEnabled = false;
    const replayDuration = 50;
    const routeStore = { database: 'gpx-route-replay', store: 'routes', key: 'current' };
    const preferenceDefaultsVersion = '4';

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const savePreference = (key, value) => {
      try { localStorage.setItem(key, String(value)); } catch {}
    };
    const readPreference = (key) => {
      try { return localStorage.getItem(key); } catch { return null; }
    };
    const formatTime = (seconds) => {
      const elapsed = Math.max(0, Math.floor(seconds));
      return [Math.floor(elapsed / 3600), Math.floor(elapsed % 3600 / 60), elapsed % 60]
        .map((part) => String(part).padStart(2, '0')).join(':');
    };
    const formatPace = (seconds) => {
      if (!Number.isFinite(seconds) || seconds <= 0) return '—';
      const rounded = Math.round(seconds);
      return `${Math.floor(rounded / 60)}:${String(rounded % 60).padStart(2, '0')}/km`;
    };
    const formatStartTime = (timestamp) => {
      const date = new Date(timestamp);
      if (!Number.isFinite(date.getTime())) return '—';
      const pad = (part) => String(part).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    };
    const cleanFileName = (fileName) => fileName
      .replace(/\.[^.]+$/, '')
      .replace(/[_-]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, (letter) => letter.toUpperCase()) || 'Route';

    const bearingBetween = (a, b) => {
      const toRad = Math.PI / 180;
      const toDeg = 180 / Math.PI;
      const lon = (b.lon - a.lon) * toRad;
      const lat1 = a.lat * toRad;
      const lat2 = b.lat * toRad;
      return Math.atan2(
        Math.sin(lon) * Math.cos(lat2),
        Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon)
      ) * toDeg;
    };

    const blendBearing = (current, target, amount) => {
      const delta = ((target - current + 540) % 360) - 180;
      return current + delta * amount;
    };

    console.assert(
      clamp(2, 0, 1) === 1 &&
      formatTime(3299) === '00:54:59' &&
      formatPace(355.4) === '5:55/km' &&
      formatStartTime(new Date(2026, 6, 27, 11, 1).getTime()) === '2026-07-27 11:01' &&
      cleanFileName('sample_route.gpx') === 'Sample Route' &&
      ui.speed.value === '1' &&
      [...ui.speed.options].map((option) => Number(option.value)).join() === '0.05,0.1,0.5,1,2,4' &&
      Math.abs(blendBearing(170, -170, .5) - 180) < .001,
      'Route helpers failed'
    );
    function lineFeature(list) {
      if (list.length < 2) return emptyFeatureCollection();
      return {
        type: 'Feature',
        properties: {},
        geometry: { type: 'LineString', coordinates: list.map((point) => [point.lon, point.lat]) }
      };
    }

    const usableProjection = (point, width, height) =>
      Number.isFinite(point.x) && Number.isFinite(point.y) &&
      point.x >= -width && point.x <= width * 2 &&
      point.y >= -height && point.y <= height * 2;
    console.assert(
      usableProjection({ x: 150, y: 300 }, 300, 600) &&
      !usableProjection({ x: -1000, y: 300 }, 300, 600),
      'Route projection guard failed'
    );

    function drawRouteOverlay() {
      if (!view3dEnabled && !overlayVisible) return;
      const width = routeOverlay.clientWidth;
      const height = routeOverlay.clientHeight;
      const scale = devicePixelRatio || 1;
      if (routeOverlay.width !== Math.round(width * scale) || routeOverlay.height !== Math.round(height * scale)) {
        routeOverlay.width = Math.round(width * scale);
        routeOverlay.height = Math.round(height * scale);
      }
      const context = routeOverlay.getContext('2d');
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, width, height);
      overlayVisible = view3dEnabled && completedRoute.length > 1;
      if (!overlayVisible) return;

      context.beginPath();
      const maxJump = Math.hypot(width, height);
      let previous = null;
      for (const point of completedRoute) {
        const projected = map.project([point.lon, point.lat]);
        if (!usableProjection(projected, width, height)) {
          previous = null;
          continue;
        }
        const continuous = previous && Math.hypot(projected.x - previous.x, projected.y - previous.y) <= maxJump;
        context[continuous ? 'lineTo' : 'moveTo'](projected.x, projected.y);
        previous = projected;
      }
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = '#e21d2f';
      context.lineWidth = 6;
      context.stroke();

      const tip = map.project([completedRoute.at(-1).lon, completedRoute.at(-1).lat]);
      if (!usableProjection(tip, width, height)) return;
      context.beginPath();
      context.arc(tip.x, tip.y, 8, 0, Math.PI * 2);
      context.fillStyle = '#c9ff45';
      context.fill();
      context.lineWidth = 3;
      context.strokeStyle = '#10150f';
      context.stroke();
    }

    function addMapLayers() {
      map.addSource('terrain-dem', hasMapTilerKey ? {
        type: 'raster-dem',
        url: 'https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json',
        encoding: 'mapbox'
      } : {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        tileSize: 256,
        maxzoom: 15,
        encoding: 'terrarium'
      });
      map.addSource('route-complete', { type: 'geojson', data: emptyFeatureCollection(), tolerance: 0 });
      map.addSource('runner', { type: 'geojson', data: emptyFeatureCollection() });

      const firstSymbol = map.getStyle().layers.find((layer) => layer.type === 'symbol')?.id;
      const vectorSource = Object.entries(map.getStyle().sources).find(([, source]) => source.type === 'vector')?.[0];
      if (vectorSource) {
        map.addLayer({
          id: '3d-buildings',

            'fill-extrusion-opacity': .72,
            'fill-extrusion-vertical-gradient': true
          }

      map.addLayer({ id: 'route-complete', type: 'line', source: 'route-complete', paint: {
        'line-color': '#e21d2f', 'line-width': 6, 'line-opacity': 1
      }, layout: { 'line-cap': 'round', 'line-join': 'round' }}, firstSymbol);
      map.addLayer({ id: 'runner-shadow', type: 'circle', source: 'runner', paint: {

        'circle-radius': 8, 'circle-color': '#c9ff45', 'circle-stroke-width': 3, 'circle-stroke-color': '#10150f'

    function openRouteDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(routeStore.database, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(routeStore.store);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveRoute(fileName, format, data) {

      await new Promise((resolve, reject) => {
        const transaction = database.transaction(routeStore.store, 'readwrite');
        transaction.objectStore(routeStore.store).put({ fileName, format, data }, routeStore.key);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      });
      database.close();
    }

    const { isRecordingSupported, createMapRecorder } = RouteRecorder;
    const recordingSupported = isRecordingSupported();
    let recorder = null;
    let pendingResult = null;
    let routeBaseName = '';
    const REC_INDICATOR = $('#rec-indicator');

    const RECORD_PREVIEW = $('#record-dialog-preview');
    const RECORD_PREVIEW_FALLBACK = $('#record-dialog-preview-fallback');
    const RECORD_DURATION = $('#record-dialog-duration');
    const RECORD_SIZE = $('#record-dialog-size');
    const RECORD_RESOLUTION = $('#record-dialog-resolution');
    const RECORD_SAVE = $('#record-dialog-save');
    const RECORD_DISCARD = $('#record-dialog-discard');
    const RECORD_CLOSE = $('#record-dialog-close');
    const RECORD_FALLBACK = $('#record-dialog-fallback');
    const REC_ERROR = $('#rec-error');
    let recErrorTimer = 0;
    const showRecError = (message) => {

    const setRecIndicator = (on) => {

    let recordTicker = 0;

        recordTicker = requestAnimationFrame(recordTick);

    const formatBytes = (bytes) => {
      if (!Number.isFinite(bytes)) return '';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    };
    const formatDuration = (ms) => {
      const total = Math.max(0, Math.round(ms / 1000));

    let previewFrameUrl = null;
    const closeRecordDialog = () => {
      if (!RECORD_DIALOG.classList.contains('open')) return;

      }

      RECORD_FALLBACK.textContent = '';
      RECORD_PREVIEW_FALLBACK.classList.remove('show');
      pendingResult = null;
    };

    // Snapshot the recording canvas synchronously. MediaRecorder was
    // reading from captureCompositor.getCanvas(), so whatever it draws
    // right now is visually identical to the video's last frame — and
    // we never have to decode the MP4/WebM in a hidden <video>, which
    // is what failed on iOS Safari.
    const captureCanvasSnapshot = () => {
      if (!captureCompositor) return null;
      const compCanvas = captureCompositor.getCanvas();
      if (!compCanvas || !compCanvas.width || !compCanvas.height) return null;
      try {
        return compCanvas.toDataURL('image/jpeg', 0.85);
      } catch {
        return null;
      }
    };

    const showRecordDialog = (result, thumbnail) => {
      pendingResult = result;
      RECORD_DURATION.textContent = formatDuration(result.durationMs);
      RECORD_SIZE.textContent = formatBytes(result.blob.size);
      RECORD_RESOLUTION.textContent = `${result.width}×${result.height}`;
      RECORD_PREVIEW.removeAttribute('src');
      RECORD_PREVIEW_FALLBACK.classList.remove('show');
      RECORD_SAVE.disabled = false;
      RECORD_DISCARD.disabled = false;
      RECORD_CLOSE.disabled = false;
      if (thumbnail) {
        RECORD_PREVIEW.src = thumbnail;
        RECORD_PREVIEW_FALLBACK.classList.remove('show');
      } else {
        RECORD_PREVIEW.removeAttribute('src');
        RECORD_PREVIEW_FALLBACK.textContent = t('previewFallback');

    const canShareRecording = (file) => {
      if (typeof navigator === 'undefined' || !navigator.canShare || !navigator.share) return false;
      try { return navigator.canShare({ files: [file] }); } catch { return false; }
    };

    const saveRecording = async () => {
      if (!pendingResult) return;
      const { blob, fileName, mimeType } = pendingResult;
      RECORD_SAVE.disabled = true;
      const restoreSave = () => { RECORD_SAVE.disabled = false; };

      // 1. File System Access API (Chrome 86+, Edge). On macOS this opens
      //    the native save picker so the user has an explicit destination.
      //    Requires a secure context (HTTPS, which GH Pages serves).
      if (typeof window !== 'undefined' && window.isSecureContext && typeof window.showSaveFilePicker === 'function') {
        try {
          const ext = mimeType === 'video/mp4' ? '.mp4' : '.webm';
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{ description: t('videoRecordingDesc'), accept: { [mimeType]: [ext] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          closeRecordDialog();
          setStatus('statusSaved', { name: handle.name || fileName, size: formatBytes(blob.size) });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') { restoreSave(); setStatus('statusSaveCancelled'); return; }
          console.warn('showSaveFilePicker failed, falling back:', err);
          // Falls through to share / download path.
        }
      }

      // 2. Web Share API (Safari mac/iOS, mobile Chrome). Opens the
      //    share sheet so the user can drop the file into Photos,
      //    Messages, Finder, etc.
      const file = new File([blob], fileName, { type: mimeType });
      if (canShareRecording(file)) {
        try {
          await navigator.share({ files: [file], title: t('shareTitle') });
          closeRecordDialog();
          setStatus('statusSaved', { name: fileName, size: formatBytes(blob.size) });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') { restoreSave(); return; }
          RECORD_FALLBACK.textContent = t('shareCancelled');
          RECORD_FALLBACK.classList.add('show');
        }
      }

      // 3. Anchor download fallback (Firefox, older Chrome, or when
      //    the user dismissed the share sheet). Chrome downloads to
      //    ~/Downloads/ on macOS by default.
      const link = document.createElement('a');
      link.href = pendingResult.url;
      link.download = fileName;
      document.body.append(link);
      link.click();
      link.remove();
      closeRecordDialog();
      setStatus('statusDownloaded', { name: fileName, size: formatBytes(blob.size) });
    };

    RECORD_SAVE.addEventListener('click', saveRecording);
    RECORD_DISCARD.addEventListener('click', closeRecordDialog);
    RECORD_CLOSE.addEventListener('click', closeRecordDialog);

    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && RECORD_DIALOG.classList.contains('open')) {
        event.preventDefault();

      }
    });

    const createRecorderInstance = () => {
      if (!recordingSupported || !mapReady || !captureCompositor) return null;
      captureCompositor.reset();
      captureCompositor.start();
      return createMapRecorder(captureCompositor.getCanvas(), {
        fps: 30,
        bitrate: 5_000_000,
        routeName: routeBaseName
      });
    };

    const startRecording = async () => {
      if (recorder || !recordingSupported || !ui.recordToggle.checked) return;
      cancelPendingStop();
      if (!mapReady) {
        await mapLoaded;
      }
      const instance = createRecorderInstance();
      if (!instance) return;
      try {
        await instance.start();
        recorder = instance;
        currentRecordingStart = performance.now();
        setRecIndicator(true);
      } catch (error) {
        console.warn('Recorder: failed to start', error);
        showRecError(t('recStartError', { detail: translateError(error.message) }));
        setStatus('recUnavailable', { detail: translateError(error.message) });
      }
    };

    let pendingStopTimer = 0;
    const cancelPendingStop = () => {
      if (pendingStopTimer) { clearTimeout(pendingStopTimer); pendingStopTimer = 0; }
    };
    const stopRecordingAndPrompt = async () => {
      setRecIndicator(false);
      if (recordTicker) cancelAnimationFrame(recordTicker);
      recordTicker = 0;
      REC_ELAPSED.textContent = '';
      if (!recorder) return;
      const instance = recorder;
      recorder = null;
      let result = null;
      try {
        result = await instance.stop();
      } catch (error) {
        console.warn('Recorder: failed to finalize', error);
        showRecError(t('recFinalizeError', { detail: translateError(error.message) }));
        setStatus('recFailed', { detail: translateError(error.message) });
      } finally {
        if (captureCompositor) captureCompositor.stop();
      }
      if (result && result.blob && result.blob.size > 0) {
        const thumbnail = captureCanvasSnapshot();
        showRecordDialog(result, thumbnail);
      } else {
        showRecError(t('recEmptyLong'));
        setStatus('recEmpty');
      }
    };

    const discardRecording = () => {
      if (!recorder) { if (captureCompositor) captureCompositor.stop(); return; }
      setRecIndicator(false);
      recorder.discard();
      recorder = null;
      if (captureCompositor) captureCompositor.stop();
    };

    function setPlayState(nextPlaying, { naturalEnd = false } = {}) {
      const wasPlaying = playing;
      playing = nextPlaying;
      for (const button of ui.playButtons) {
        button.textContent = playing ? 'Ⅱ' : '▶';
        button.setAttribute('aria-label', playing ? t('pauseRoute') : progress >= 1 ? t('replayRoute') : t('playRoute'));
      }
      if (!wasPlaying && playing) {
        startRecording();
      } else if (wasPlaying && !playing && recorder) {
        if (naturalEnd) {
          // Natural completion at 100%: zoom out and let the recording
          // capture the animation before we hand the user a save dialog.
          endOfReplayZoom();
          const zoomMs = reducedMotion ? 0 : endOfReplayDuration;
          cancelPendingStop();
          pendingStopTimer = setTimeout(() => {
            pendingStopTimer = 0;
            stopRecordingAndPrompt();
          }, zoomMs + 100);
        } else {
          stopRecordingAndPrompt();
        }
      }
    }

    let statusTimer = 0;
    function showStatusText(message) {
      ui.status.textContent = message;
      ui.status.classList.toggle('show', Boolean(message));
      if (statusTimer) clearTimeout(statusTimer);
      if (message) statusTimer = setTimeout(() => ui.status.classList.remove('show'), 4500);
    }
    function setStatus(key, params) {
      lastStatus = { key, params };
      showStatusText(t(key, params));
    }
    function setStatusRaw(message) {
      lastStatus = { raw: message };
      showStatusText(message);
    }
    const gpsFilterStatus = (track) => GPS_SPEED_FILTER_ENABLED
      ? { key: 'gpsFiltered', params: { removed: track.removedPoints, max: MAX_ALLOWED_SPEED_KILOMETERS_PER_HOUR } }
      : { key: 'gpsFilterOff' };

    function setViewMode(enabled, animate = true) {
      view3dEnabled = enabled;
      ui.view3dToggle.checked = enabled;
      savePreference('3d-enabled', enabled);
      if (!mapReady) return;

      if (map.getLayer('3d-buildings')) map.setLayoutProperty('3d-buildings', 'visibility', enabled ? 'visible' : 'none');
      for (const id of ['route-complete', 'runner-shadow', 'runner-dot']) {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', enabled ? 'none' : 'visible');
      }

      const camera = { pitch: enabled ? 50 : 0, bearing: enabled ? -18 : 0 };
      const moveCamera = () => {
        if (enabled !== view3dEnabled) return;
        if (!animate || reducedMotion) map.jumpTo(camera);
        else map.easeTo({ ...camera, duration: 700, essential: false });
      };
      if (enabled) {
        map.jumpTo({ pitch: 0, bearing: 0 });
        const enableTerrain = () => {
          if (!view3dEnabled) return;
          map.setTerrain({ source: 'terrain-dem', exaggeration: 1 });
          moveCamera();
        };
        if (animate) enableTerrain();
        else {
          map.setTerrain(null);
          setTimeout(enableTerrain, 500);
        }
      } else {
        map.setTerrain(null);
        moveCamera();
      }
      setStatus(enabled ? 'terrain3dOn' : 'terrain2dOn');
    }

    function parseGpx(xmlText) {
      const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
      if (xml.querySelector('parsererror')) throw new Error(t('errorInvalidXml'));

      const trackPoints = [...xml.getElementsByTagNameNS('*', 'trkpt')].map((node, index) => {
        const value = (name) => node.getElementsByTagNameNS('*', name)[0]?.textContent;
        return {
          lat: Number(node.getAttribute('lat')),
          lon: Number(node.getAttribute('lon')),
          ele: Number(value('ele')),
          time: Date.parse(value('time')),
          hr: Number(value('hr')),
          index
        };
      }).filter((point) => Number.isFinite(point.lat) && Number.isFinite(point.lon));

      if (trackPoints.length < 2) throw new Error(t('errorGpxTwoPoints'));
      return prepareTrack(trackPoints);
    }

    let fitSdkPromise;
    const loadFitSdk = () => fitSdkPromise ??= import('./fit-sdk.js');

    async function parseFit(arrayBuffer) {
      const FitSdk = await loadFitSdk();
      const stream = FitSdk.Stream.fromArrayBuffer(arrayBuffer);
      const decoder = new FitSdk.Decoder(stream);
      if (!decoder.isFIT()) throw new Error(t('errorFitHeader'));

      const { messages, errors } = decoder.read();
      if (errors.length) throw new Error(t('errorFitDecode', { detail: errors[0].message }));
      if (messages.fileIdMesgs?.[0]?.type !== 'activity') {
        throw new Error(t('errorFitNotActivity'));
      }

      const semicirclesToDegrees = 180 / (2 ** 31);
      const fitTimestamp = (value) => {
        if (value instanceof Date) return value.getTime();
        const timestamp = Number(value);
        return Number.isFinite(timestamp) ? timestamp * 1000 + FitSdk.Utils.FIT_EPOCH_MS : Number.NaN;
      };
      const trackPoints = (messages.recordMesgs ?? []).map((record, index) => ({
        lat: Number(record.positionLat) * semicirclesToDegrees,
        lon: Number(record.positionLong) * semicirclesToDegrees,
        ele: Number(record.enhancedAltitude ?? record.altitude),
        time: fitTimestamp(record.timestamp),
        hr: Number(record.heartRate),
        index
      })).filter((point) =>
        Number.isFinite(point.lat) && point.lat >= -90 && point.lat <= 90 &&
        Number.isFinite(point.lon) && point.lon >= -180 && point.lon <= 180
      );

      if (trackPoints.length < 2) throw new Error(t('errorFitTwoPoints'));
      return prepareTrack(trackPoints);
    }

    const routeFormat = (fileName) => fileName.toLowerCase().endsWith('.fit') ? 'fit' :
      fileName.toLowerCase().endsWith('.gpx') ? 'gpx' : null;

    async function parseRouteData(format, data) {
      if (format === 'fit') return parseFit(data);
      if (format === 'gpx') return parseGpx(data);
      throw new Error(t('errorChooseFormat'));
    }

    function makeMarker(label, point, className = '') {
      const element = document.createElement('div');
      element.className = `marker-label ${className}`;
      element.textContent = label;
      return new maplibregl.Marker({ element, anchor: 'center', opacityWhenCovered: 1 }).setLngLat([point.lon, point.lat]);
    }

    const endOfReplayDuration = 1800;
    function fitRouteOverview({ duration = 800, pitch = 0 } = {}) {
      const bounds = new maplibregl.LngLatBounds();
      displayPoints.forEach((point) => bounds.extend([point.lon, point.lat]));
      map.fitBounds(bounds, {
        padding: { top: 110, right: 55, bottom: ui.dashboard.classList.contains('collapsed') ? 100 : 150, left: 55 },
        bearing: 0,
        pitch,
        duration: reducedMotion ? 0 : duration,
        essential: false
      });
    }
    function endOfReplayZoom() {
      fitRouteOverview({ duration: endOfReplayDuration, pitch: view3dEnabled ? 30 : 0 });
    }

    async function setup(track, fileName) {
      discardRecording();
      setPlayState(false);
      routeBaseName = (fileName || 'route-replay').replace(/\.[^.]+$/, '');
      progress = 0;
      lastFrame = 0;
      completedRoute = [];
      mileageMarkers.forEach(({ marker }) => marker.remove());
      endpointMarkers.forEach((marker) => marker.remove());
      mileageMarkers = [];
      endpointMarkers = [];
      points = track.points;
      displayPoints = points;
      ui.title.textContent = cleanFileName(fileName);
      document.title = `${ui.title.textContent} — ${t('docTitleSuffix')}`;
      totalDuration = Math.max(1, (points.at(-1).time - points[0].time) / 1000);
      cumulativeDistance = [0];
      for (let index = 1; index < points.length; index++) {
        cumulativeDistance[index] = cumulativeDistance[index - 1] + haversine(points[index - 1], points[index]);
      }
      totalDistance = cumulativeDistance.at(-1);
      await mapLoaded;

      for (let km = 1; km * 1000 <= totalDistance; km++) {
        const distance = km * 1000;
        const index = cumulativeDistance.findIndex((value) => value >= distance);
        const previousDistance = cumulativeDistance[index - 1];
        const mix = (distance - previousDistance) / (cumulativeDistance[index] - previousDistance);
        const a = points[index - 1];
        const b = points[index];
        const element = document.createElement('div');
        element.className = 'km-marker';
        const label = document.createElement('span');
        const number = document.createElement('b');
        number.textContent = String(km);
        label.append(number);
        element.setAttribute('aria-label', t('kmMarker', { km }));
        element.append(label);
        mileageMarkers.push({
          distance,
          marker: new maplibregl.Marker({ element, anchor: 'bottom', opacityWhenCovered: 1 })
            .setLngLat([a.lon + (b.lon - a.lon) * mix, a.lat + (b.lat - a.lat) * mix])
        });
      }
      console.assert(mileageMarkers.length === Math.floor(totalDistance / 1000), 'Mileage marker setup failed');

      endpointMarkers = [makeMarker('S', points[0]), makeMarker('F', points.at(-1), 'end')];
      updateEndpointMarkers();

      fitRouteOverview();
      setViewMode(view3dEnabled, false);
      ui.totalDistance.textContent = `${(totalDistance / 1000).toFixed(2)} km`;
      ui.startTime.textContent = formatStartTime(track.startTime);
      ui.averagePace.textContent = formatPace(totalDuration / (totalDistance / 1000));
      ui.emptyState.hidden = true;
      emptyStateMessage = null;
      setStatus('loadedFromDevice', { name: ui.title.textContent, filter: gpsFilterStatus(track) });
      render(0);
    }

    function updateMileageMarkers(distance) {
      for (const milestone of mileageMarkers) {
        const visible = ui.markerToggle.checked && milestone.distance <= distance;
        if (visible && !milestone.marker.getElement().isConnected) milestone.marker.addTo(map);
        if (!visible && milestone.marker.getElement().isConnected) milestone.marker.remove();
        const opacity = distance - milestone.distance > 1500 ? .45 : 1;
        milestone.marker.setOpacity(opacity, opacity);
      }
    }

    function updateEndpointMarkers() {
      for (const marker of endpointMarkers) {
        const visible = marker.getElement().isConnected;
        if (ui.endpointToggle.checked && !visible) marker.addTo(map);
        if (!ui.endpointToggle.checked && visible) marker.remove();
      }
    }

    function pointAt(routeProgress) {
      const targetTime = points[0].time + routeProgress * totalDuration * 1000;
      let low = 0;
      let high = points.length - 1;
      while (low < high) {
        const middle = Math.ceil((low + high) / 2);
        if (points[middle].time <= targetTime) low = middle;
        else high = middle - 1;
      }
      const index = Math.min(low, points.length - 2);
      const a = points[index];
      const b = points[index + 1];
      const mix = clamp((targetTime - a.time) / Math.max(1, b.time - a.time), 0, 1);
      const current = {
        index,
        mix,
        lat: a.lat + (b.lat - a.lat) * mix,
        lon: a.lon + (b.lon - a.lon) * mix,
        ele: a.ele + (b.ele - a.ele) * mix,
        hr: Math.round(a.hr + (b.hr - a.hr) * mix)
      };
      current.distance = cumulativeDistance[index] + haversine(a, current);
      current.bearing = bearingBetween(a, b);
      return current;
    }

    function updateFollowCamera(current) {
      if (!ui.followToggle.checked) return;
      followBearing = blendBearing(followBearing, current.bearing, .28);
      const camera = {
        center: [current.lon, current.lat],
        bearing: view3dEnabled ? followBearing : 0,
        pitch: view3dEnabled ? 50 : 0,
        zoom: Math.max(map.getZoom(), view3dEnabled ? 15.3 : 14.5)
      };
      map.jumpTo(camera);
    }

    function render(nextProgress) {
      progress = clamp(nextProgress, 0, 1);
      const current = pointAt(progress);
      const completed = displayPoints.slice(0, current.index + 1);
      completed.push(current);
      completedRoute = completed;
      map.getSource('route-complete').setData(lineFeature(completedRoute));
      map.getSource('runner').setData({
        type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [current.lon, current.lat] }
      });
      ui.progress.value = Math.round(progress * 1000);
      const currentDistance = `${(current.distance / 1000).toFixed(2)} km`;
      const elapsedTime = formatTime(progress * totalDuration);
      ui.distance.textContent = ui.compactDistance.textContent = currentDistance;
      ui.elapsed.textContent = elapsedTime;
      lastProgressText = { distance: currentDistance, total: `${(totalDistance / 1000).toFixed(2)} km`, elapsed: elapsedTime };
      ui.progress.setAttribute('aria-valuetext', t('progressValue', lastProgressText));
      ui.elevation.textContent = Number.isFinite(current.ele) ? `${Math.round(current.ele)} m` : '—';
      ui.heartRate.textContent = Number.isFinite(current.hr) ? `${current.hr} bpm` : '—';
      updateMileageMarkers(current.distance);
      updateFollowCamera(current);
    }

    function frame(timestamp) {
      if (!playing) return;
      if (!lastFrame) lastFrame = timestamp;
      render(progress + ((timestamp - lastFrame) / 1000 / replayDuration) * speed);
      lastFrame = timestamp;
      if (progress >= 1) {
        setPlayState(false, { naturalEnd: true });
        return;
      }
      requestAnimationFrame(frame);
    }

    function togglePlayback() {
      if (!points.length) {
        ui.fileInputs[0].click();
        return;
      }
      if (progress >= 1) render(0);
      setPlayState(!playing);
      lastFrame = 0;
      if (playing) requestAnimationFrame(frame);
    }

    for (const button of ui.playButtons) button.addEventListener('click', togglePlayback);
    ui.restart.addEventListener('click', () => {
      if (!points.length) return;
      render(0);
      if (!playing) togglePlayback();
    });
    ui.progress.addEventListener('input', (event) => {
      if (points.length) render(Number(event.target.value) / 1000);
    });
    ui.speed.addEventListener('change', () => {
      speed = Number(ui.speed.value);
      setStatus('speedSet', { speed });
    });
    ui.markerToggle.addEventListener('change', () => {
      savePreference('km-markers-enabled', ui.markerToggle.checked);
      if (points.length) updateMileageMarkers(pointAt(progress).distance);
    });
    ui.endpointToggle.addEventListener('change', updateEndpointMarkers);
    ui.view3dToggle.addEventListener('change', () => setViewMode(ui.view3dToggle.checked));
    ui.followToggle.addEventListener('change', () => {
      savePreference('follow-enabled', ui.followToggle.checked);
      if (ui.followToggle.checked && points.length) {
        const current = pointAt(progress);
        followBearing = current.bearing;
        updateFollowCamera(current);
      }
      setStatus(ui.followToggle.checked ? 'followOn' : 'followOff');
    });
    map.on('render', drawRouteOverlay);
    map.on('resize', drawRouteOverlay);
    ui.dashboardCollapse.addEventListener('click', () => setDashboardCollapsed(true));
    ui.dashboardExpand.addEventListener('click', () => setDashboardCollapsed(false));

    const settingsToggle = $('#settings-toggle');
    const settingsPopover = $('#settings-popover');
    const setSettingsOpen = (open) => {
      settingsPopover.hidden = !open;
      settingsToggle.setAttribute('aria-expanded', String(open));
    };
    settingsToggle.addEventListener('click', () => setSettingsOpen(settingsPopover.hidden));
    document.addEventListener('click', (event) => {
      if (settingsPopover.hidden) return;
      if (!settingsPopover.contains(event.target) && !settingsToggle.contains(event.target)) setSettingsOpen(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !settingsPopover.hidden && !event.defaultPrevented) setSettingsOpen(false);
    });

    for (const eventName of ['dragstart', 'rotatestart', 'pitchstart']) {
      map.on(eventName, (event) => {
        if (event.originalEvent && ui.followToggle.checked) {
          ui.followToggle.checked = false;
          savePreference('follow-enabled', false);
          setStatus('followPaused');
        }
      });
    }

    async function importRoute(file) {
      if (!file) return;
      try {
        const routeName = cleanFileName(file.name);
        setStatus('opening', { name: routeName });
        if (!ui.emptyState.hidden) {
          setEmptyStateMessage('opening', { name: routeName });
        }
        const format = routeFormat(file.name);
        if (!format) throw new Error(t('errorFileExtension'));
        const data = format === 'fit' ? await file.arrayBuffer() : await file.text();
        const track = await parseRouteData(format, data);
        await setup(track, file.name);
        try {
          await saveRoute(file.name, format, data);
          setStatus('loadedSaved', { name: cleanFileName(file.name), filter: gpsFilterStatus(track) });
        } catch {
          setStatus('loadedNoSave', { name: cleanFileName(file.name), filter: gpsFilterStatus(track) });
        }
      } catch (error) {
        ui.emptyState.hidden = false;
        showRouteError(error.message);
      }
    }

    for (const input of ui.fileInputs) {
      input.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        for (const otherInput of ui.fileInputs) otherInput.value = '';
        setSettingsOpen(false);
        await importRoute(file);
      });
    }

    const savedDashboardState = readPreference('dashboard-collapsed');
    setDashboardCollapsed(
      savedDashboardState === null
        ? matchMedia('(max-width: 580px)').matches
        : savedDashboardState === 'true'
    );
    if (readPreference('preference-defaults-version') !== preferenceDefaultsVersion) {
      ui.markerToggle.checked = false;
      ui.view3dToggle.checked = true;
      ui.followToggle.checked = true;
      ui.recordToggle.checked = false;
      savePreference('km-markers-enabled', false);
      savePreference('3d-enabled', true);
      savePreference('follow-enabled', true);
      savePreference('record-enabled', false);
      savePreference('preference-defaults-version', preferenceDefaultsVersion);
    } else {
      ui.markerToggle.checked = readPreference('km-markers-enabled') === 'true';
      ui.view3dToggle.checked = readPreference('3d-enabled') !== 'false';
      ui.followToggle.checked = readPreference('follow-enabled') !== 'false';
      ui.recordToggle.checked = readPreference('record-enabled') === 'true';
    }
    if (!recordingSupported) {
      ui.recordToggle.disabled = true;
      ui.recordToggle.parentElement.title = t('recUnsupported');
    } else {
      ui.recordToggle.addEventListener('change', () => {
        savePreference('record-enabled', ui.recordToggle.checked);
        setStatus(ui.recordToggle.checked ? 'recArmed' : 'recDisarmed');
      });
    }
    view3dEnabled = ui.view3dToggle.checked;

    for (const button of document.querySelectorAll('.lang-toggle button')) {
      button.addEventListener('click', () => applyLang(button.dataset.lang));
    }
    applyLang(readPreference('gpxreplay-lang') || 'zh-Hant');

    readSavedRoute()
      .then((saved) => {
        if (!saved) return mapLoaded.then(() => setViewMode(view3dEnabled, false));
        const format = saved.format ?? 'gpx';
        const data = saved.data ?? saved.xmlText;
        return parseRouteData(format, data).then((track) => setup(track, saved.fileName));
      })
      .catch(() => setStatus('chooseToBegin'));
  </script>

  <div class="rec-indicator" id="rec-indicator" aria-live="polite" aria-label="正在錄製" data-i18n-aria="recIndicatorAria">
    <span class="dot" aria-hidden="true"></span>
    REC
  </div>
  <div class="rec-error" id="rec-error" role="alert" aria-live="assertive"></div>

  <div class="record-dialog" id="record-dialog" role="dialog" aria-modal="true" aria-labelledby="record-dialog-title">
    <div class="card">
      <button type="button" class="close" id="record-dialog-close" aria-label="關閉" data-i18n-aria="close">×</button>
      <div class="header">
        <span class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="13" height="12" rx="2"></rect>
            <path d="m22 8-6 4 6 4z"></path>
          </svg>
        </span>
        <h2 id="record-dialog-title" data-i18n="recordDialogTitle">儲存回放影片？</h2>
      </div>
      <p class="meta" id="record-dialog-meta"><span id="record-dialog-duration">—</span><span id="record-dialog-size">—</span><span id="record-dialog-resolution">—</span></p>
      <img id="record-dialog-preview" class="preview" alt="回放錄製的最後畫面" data-i18n-alt="previewAlt">
      <p class="preview-fallback" id="record-dialog-preview-fallback" data-i18n="previewFallback">無法顯示預覽 — 錄製已成功儲存。</p>
      <p class="fallback-note" id="record-dialog-fallback"></p>
      <div class="actions">
        <button type="button" class="discard" id="record-dialog-discard" data-i18n="discard">捨棄</button>
        <button type="button" class="save" id="record-dialog-save" data-i18n="save">儲存</button>
      </div>
    </div>
  </div>
</body>
</html>
